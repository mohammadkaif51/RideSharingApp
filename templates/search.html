<!DOCTYPE html>
<html>
<head>
    <title>Find Ride</title>
</head>
<body>

<h2>🔍 Find Ride</h2>

<form method="POST">

    From:
    <input type="text" name="source"><br><br>

    To:
    <input type="text" name="destination"><br><br>

    <button type="submit">Search Ride</button>

</form>

<hr>

{% if rides %}

<h3>Available Rides</h3>

<ul>

{% for ride in rides %}

<li>
    {{ ride[1] }} → {{ ride[2] }}
    | Seats: {{ ride[3] }}
    | Time: {{ ride[4] }}

    <form action="/book/{{ ride[0] }}" method="POST">

        <input type="number" name="book_seats" placeholder="Seats Needed">

        <button type="submit">Book Ride</button>

    </form>

</li>

<br>

{% endfor %}

</ul>

{% endif %}

<br>
<a href="/">Back</a>

</body>
</html>
